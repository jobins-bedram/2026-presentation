<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.4" fill="#7d97b8"/>
    </pattern>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#7d97b8" stroke-width="2.2"/>
    </pattern>
  </defs>

  <!-- top-left cluster -->
  <circle cx="30" cy="10" r="150" fill="#8ba5c4" opacity="0.9"/>
  <circle cx="185" cy="165" r="85" fill="url(#dots)" opacity="0.75"/>
  <circle cx="300" cy="45" r="52" fill="none" stroke="#aabdd6" stroke-width="12" opacity="0.8"/>
  <circle cx="285" cy="80" r="40" fill="none" stroke="#8ba5c4" stroke-width="4" opacity="0.7"/>
  <circle cx="20" cy="215" r="30" fill="none" stroke="#9db3cd" stroke-width="5" opacity="0.7"/>

  <!-- top-right cluster -->
  <circle cx="1245" cy="35" r="58" fill="#7d97b8" opacity="0.85"/>
  <circle cx="1340" cy="80" r="42" fill="none" stroke="#9db3cd" stroke-width="6" opacity="0.8"/>
  <circle cx="1470" cy="15" r="95" fill="url(#hatch)" opacity="0.8"/>
  <circle cx="1560" cy="130" r="60" fill="#8ba5c4" opacity="0.8"/>
  <circle cx="1435" cy="150" r="26" fill="none" stroke="#aabdd6" stroke-width="9" opacity="0.75"/>
  <circle cx="1590" cy="245" r="34" fill="none" stroke="#9db3cd" stroke-width="5" opacity="0.6"/>

  <!-- bottom-right cluster -->
  <circle cx="1545" cy="855" r="160" fill="#7d97b8" opacity="0.9"/>
  <circle cx="1420" cy="705" r="80" fill="url(#dots)" opacity="0.75"/>
  <circle cx="1275" cy="835" r="48" fill="none" stroke="#aabdd6" stroke-width="11" opacity="0.8"/>
  <circle cx="1180" cy="880" r="30" fill="#9db3cd" opacity="0.7"/>
  <circle cx="1330" cy="765" r="22" fill="none" stroke="#8ba5c4" stroke-width="4" opacity="0.7"/>

  <!-- bottom-left cluster -->
  <circle cx="55" cy="865" r="75" fill="url(#hatch)" opacity="0.8"/>
  <circle cx="215" cy="885" r="46" fill="#8ba5c4" opacity="0.8"/>
  <circle cx="185" cy="810" r="26" fill="#b6c6da" opacity="0.8"/>
  <circle cx="315" cy="835" r="32" fill="none" stroke="#9db3cd" stroke-width="6" opacity="0.75"/>
  <circle cx="120" cy="770" r="20" fill="none" stroke="#aabdd6" stroke-width="4" opacity="0.6"/>
</svg>
